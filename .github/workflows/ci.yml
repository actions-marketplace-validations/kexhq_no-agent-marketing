name: ci
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  rules:
    name: Rule examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh

  no-agent-marketing:
    name: No agent marketing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repo enforces its own rule, using the action from the checked-out code.
      - uses: ./
